    body {

      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .page {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .header h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.8rem);
    }
    .nav-link {
      color: #7dd3fc;
      text-decoration: none;
      font-weight: 600;
    }
    .top-card {
      display: grid;
      place-items: center;
      margin: 0 auto 2rem;
      max-width: 280px;
      text-align: center;
    }
    .top-card a {
      display: block;
      width: 180px;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid rgba(125, 211, 252, 0.45);
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .top-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    .top-card p {
      margin: 0.75rem 0 0;
      font-size: 1rem;
      color: #e2e8f0;
      font-weight: 700;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 22px;
      overflow: hidden;
      text-align: center;
      padding: 1rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #60a5fa;
    }
    .card a {
      color: inherit;
      text-decoration: none;
    }
    .card img {
      width: 100%;
      height: auto;
      max-height: 160px;
      object-fit: contain;
      border-radius: 18px;
      display: block;
    }
    .card p {
      margin: 0.85rem 0 0;
      font-size: 0.98rem;
      color: #e2e8f0;
      font-weight: 600;
    }
    @media (max-width: 640px) {
      .top-card {
        width: 100%;
        max-width: 260px;
      }
    }
  </style>
